name: News Parser Bot

on:
  repository_dispatch:
    types: [trigger-news-parser] # Ждем сигнал от cron-job.org
  workflow_dispatch: # Позволит запускать бота вручную кнопкой на GitHub

jobs:
  run-parser:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Разрешаем гитхабу сохранять историю отправленного

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run script
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }} # Достаем скрытую ссылку на Дискорд
      run: python bot.py

    - name: Commit and push if database changed
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add sent_news.json
        # Коммитим только если есть изменения, чтобы не вызывать ошибку
        git diff-index --quiet HEAD || git commit -m "chore: update sent news database [skip ci]"
        git push

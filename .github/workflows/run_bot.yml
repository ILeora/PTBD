name: BDO News Parser

on:
  repository_dispatch:
    types: [trigger-news-parser]
  workflow_dispatch:

jobs:
  run-parser:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run script
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      run: python bot.py

    - name: Commit and push if database changed
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        # Создаем пустой файл базы данных, если его еще нет
        touch sent_news.json
        git add sent_news.json
        git diff-index --quiet HEAD || git commit -m "chore: update sent BDO news database [skip ci]"
        git push
